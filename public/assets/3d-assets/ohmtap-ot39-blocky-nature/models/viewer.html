<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D viewer</title>
<!-- Generated by build_models.py - do not edit by hand. Opens the GLB files of this folder in three.js

<style>
html,body{margin:0;height:100%;background:#111215;color:#F3F0E9;font:13px system-ui,sans-serif;overflow:hidden}
#top{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:4px;z-index:2;align-items:center}
select,button{background:#1d2026;color:#F3F0E9;border:1px solid #3a3f48;border-radius:4px;padding:4px 8px;cursor:pointer}
button.on{background:#FF6A13;color:#111215;border-color:#FF6A13}
#fx{position:absolute;left:8px;bottom:8px;background:#1d2026cc;padding:6px 10px;border-radius:4px;z-index:2}
#info{position:absolute;right:8px;bottom:8px;color:#8A9099;z-index:2}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
canvas{display:block}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head>
<body><div id="top"><select id="pick"></select><span id="bar"></span></div>
<label id="fx"><input type="checkbox" id="amb" checked> ambient effects</label><div id="info"></div>
<div id="err">Could not load the models. Serve the pack folder over http (python -m http.server) and keep an
internet connection for three.js.</div>
<script type="module">
const MODELS = [{"name": "spruce_small", "glb": "glb/A01_spruce_small.glb", "fx": null}, {"name": "spruce_medium", "glb": "glb/A02_spruce_medium.glb", "fx": null}, {"name": "spruce_tall", "glb": "glb/A03_spruce_tall.glb", "fx": null}, {"name": "pine", "glb": "glb/A04_pine.glb", "fx": null}, {"name": "birch_small", "glb": "glb/A05_birch_small.glb", "fx": null}, {"name": "birch_tall", "glb": "glb/A06_birch_tall.glb", "fx": null}, {"name": "oak", "glb": "glb/A07_oak.glb", "fx": null}, {"name": "oak_young", "glb": "glb/A08_oak_young.glb", "fx": null}, {"name": "dead_tree", "glb": "glb/A09_dead_tree.glb", "fx": null}, {"name": "stump", "glb": "glb/A10_stump.glb", "fx": null}, {"name": "fallen_log", "glb": "glb/A11_fallen_log.glb", "fx": null}, {"name": "mushrooms", "glb": "glb/A12_mushrooms.glb", "fx": null}, {"name": "grass_short", "glb": "glb/B01_grass_short.glb", "fx": null}, {"name": "grass_medium", "glb": "glb/B02_grass_medium.glb", "fx": null}, {"name": "grass_tall", "glb": "glb/B03_grass_tall.glb", "fx": null}, {"name": "flowers_yellow", "glb": "glb/B04_flowers_yellow.glb", "fx": null}, {"name": "flowers_white", "glb": "glb/B05_flowers_white.glb", "fx": null}, {"name": "flowers_violet", "glb": "glb/B06_flowers_violet.glb", "fx": null}, {"name": "flowers_red", "glb": "glb/B07_flowers_red.glb", "fx": null}, {"name": "bush_round", "glb": "glb/B08_bush_round.glb", "fx": null}, {"name": "bush_berry", "glb": "glb/B09_bush_berry.glb", "fx": null}, {"name": "bush_flowering", "glb": "glb/B10_bush_flowering.glb", "fx": null}, {"name": "fern", "glb": "glb/B11_fern.glb", "fx": null}, {"name": "rock_small", "glb": "glb/C01_rock_small.glb", "fx": null}, {"name": "rock_medium", "glb": "glb/C02_rock_medium.glb", "fx": null}, {"name": "rock_large", "glb": "glb/C03_rock_large.glb", "fx": null}, {"name": "cliff", "glb": "glb/C04_cliff.glb", "fx": null}, {"name": "pebbles", "glb": "glb/C05_pebbles.glb", "fx": null}, {"name": "reeds", "glb": "glb/C06_reeds.glb", "fx": null}, {"name": "lily_pad", "glb": "glb/C07_lily_pad.glb", "fx": null}, {"name": "lily_pad_flower", "glb": "glb/C08_lily_pad_flower.glb", "fx": null}, {"name": "pier", "glb": "glb/C09_pier.glb", "fx": null}, {"name": "stepping_stones", "glb": "glb/C10_stepping_stones.glb", "fx": null}, {"name": "tile_turf", "glb": "glb/D01_tile_turf.glb", "fx": null}, {"name": "tile_sand", "glb": "glb/D02_tile_sand.glb", "fx": null}, {"name": "tile_path", "glb": "glb/D03_tile_path.glb", "fx": null}, {"name": "tile_turf_raised", "glb": "glb/D04_tile_turf_raised.glb", "fx": null}, {"name": "demo_island", "glb": "glb/D05_demo_island.glb", "fx": null}];
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x111215);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
cam.position.set(4.6, 3.2, 5.4);
const controls = new OrbitControls(cam, renderer.domElement); controls.target.set(0, 0.8, 0); controls.update();
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a2622, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-4, 7, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -5, right: 5, top: 5, bottom: -5});
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(9, 64), new THREE.MeshStandardMaterial({color: 0x2c3036, roughness: 1}));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const loader = new GLTFLoader(), clock = new THREE.Clock(), bar = document.getElementById("bar");
let mixer = null, fxMixer = null, model = null, fx = null, current = null;
function play(clip, btn) {
  if (current) current.stop();
  current = mixer.clipAction(clip); current.reset().play();
  bar.querySelectorAll("button").forEach(b => b.classList.remove("on")); btn.classList.add("on");
}
async function show(m) {
  try {
    const [g, f] = await Promise.all([loader.loadAsync(m.glb), m.fx ? loader.loadAsync(m.fx) : null]);
    if (model) scene.remove(model); if (fx) scene.remove(fx);
    model = g.scene; scene.add(model);
    model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
    mixer = new THREE.AnimationMixer(model); bar.innerHTML = ""; current = null;
    g.animations.forEach((clip, i) => {
      const b = document.createElement("button"); b.textContent = clip.name; b.onclick = () => play(clip, b);
      bar.appendChild(b); if (i === 0) play(clip, b);
    });
    fx = f ? f.scene : null; fxMixer = null;
    if (fx) { scene.add(fx); fx.visible = document.getElementById("amb").checked;
              fxMixer = new THREE.AnimationMixer(fx); f.animations.forEach(a => fxMixer.clipAction(a).play()); }
    let tris = 0; model.traverse(o => { if (o.isMesh) tris += o.geometry.index.count / 3; });
    document.getElementById("info").textContent = `${m.name} · ${tris} triangles · ${g.animations.length} clips`;
  } catch (e) { document.getElementById("err").style.display = "flex"; console.error(e); }
}
const pick = document.getElementById("pick");
MODELS.forEach((m, i) => pick.add(new Option(m.name, i)));
pick.onchange = () => show(MODELS[pick.value]);
document.getElementById("amb").onchange = e => { if (fx) fx.visible = e.target.checked; };
if (!MODELS.some(m => m.fx)) document.getElementById("fx").style.display = "none";   // no ambient effects in this pack
addEventListener("resize", () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { const dt = clock.getDelta(); if (mixer) mixer.update(dt); if (fxMixer) fxMixer.update(dt);
                                  controls.update(); renderer.render(scene, cam); });
if (MODELS.length) show(MODELS[0]);
window.viewer = {play: n => bar.querySelectorAll("button").forEach(b => b.textContent === n && b.click()),
                 show: i => { pick.value = i; return show(MODELS[i]); }};
</script></body></html>
