<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OhmTap demo</title>
<!-- Offline demo: open this file directly, or run "python -m http.server" in the pack folder.
     Data comes from assets_data.js (generated by build_pack.py). No CDN, no build step. -->
<style>
:root{--ink:#111215;--panel:#1b1d22;--line:#2c2f36;--steel:#8a9099;--paper:#f3f0e9;--orange:#ff6a13;--cyan:#33d6f5}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--paper);font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 12px 0 0}h1 b{color:var(--orange)}
button,select{background:var(--panel);color:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button.on{border-color:var(--orange);color:var(--orange)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.bar label{color:var(--steel);font-size:12px}
main{padding:16px}
.grid{display:flex;flex-wrap:wrap;gap:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.stage{display:flex;align-items:center;justify-content:center;border-radius:4px;padding:8px}
.bg-dark .stage{background:#1b1d22}.bg-light .stage{background:#e9e6df}
.bg-checker .stage{background:repeating-conic-gradient(#8a909955 0 25%,#0000 0 50%) 0 0/16px 16px,#d9d6cf}
.meta{font:11px ui-monospace,Consolas,monospace;color:var(--steel);text-align:center;max-width:280px}
.states{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}.states button{padding:2px 7px;font-size:11px}
#scene{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;transform-origin:0 0}
#scene img{position:absolute;image-rendering:auto}
.wall{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#38404a 0 158px,#262a31 158px 160px)}
.floor{position:absolute;left:0;right:0;bottom:0;background:#26282c;border-top:3px solid #18191d}
.wall.night{background:linear-gradient(#111215,#1b2236 70%,#25304a)}
.floor.night{background:linear-gradient(#c4d2e6,#e4ecf6);border-top:0}
.tile{position:absolute;background-repeat:repeat-x}
.hint{color:var(--steel);font-size:12px;margin:8px 0}
.switch{cursor:pointer;outline:2px dashed #ff6a1388;outline-offset:2px}
.ruler{font:11px ui-monospace,Consolas,monospace;color:var(--steel)}
</style>
</head>
<body>
<header><h1 id="title"></h1>
<button id="tabG" class="on">Gallery</button><button id="tabS">Scenes</button>
<span class="ruler" id="scale"></span></header>
<div class="bar" id="gbar">
<label>Category</label><select id="cat"></select>
<label>Background</label><button data-bg="dark" class="on">Dark</button><button data-bg="light">Light</button><button data-bg="checker">Checker</button>
<label>Files</label><button data-res="1x" class="on">1x</button><button data-res="2x">2x</button>
<label>Zoom</label><select id="zoom"><option>0.5</option><option selected>1</option><option>2</option><option>3</option></select>
</div>
<main><div id="gallery" class="grid bg-dark"></div><div id="scenes" hidden></div></main>
<script src="assets_data.js"></script>
<script>
const D = window.OHMTAP_DATA, $ = s => document.querySelector(s);
const P = p => "../" + p;                         // paths in data are relative to the pack root
let bg = "dark", res = "1x", zoom = 1, cat = "", mode = 0, tick = 0;
const t0 = performance.now();
$("#title").innerHTML = D.studio + " <b>" + D.pack.code + "</b> " + D.pack.title;
$("#cat").innerHTML = '<option value="">All categories</option>' +
  D.cats.map(c => `<option value="${c.letter}">${c.letter} — ${c.title}</option>`).join("");
const animOf = (id, name) => D.anims.find(a => a.id === id && (!name || a.anim === name));
const assetOf = id => D.assets.find(a => a.id === id);
function frameSrc(a, r) {               // each loop plays at its own fps from the manifest
  return P(a.frame_paths[r][Math.floor((performance.now() - t0) / 1000 * a.fps) % a.frames]);
}
const modes = () => (D.scene && D.scene.modes) || ["on", "off"];   // the switch cycles through these
function updateScale() {
  $("#scale").textContent = `1 image px = ${zoom * (res === "2x" ? 0.5 : 1)} screen px · showing ${res} files`;
}
function gallery() {
  const g = $("#gallery"); g.className = "grid bg-" + bg; g.innerHTML = "";
  for (const a of D.assets.filter(a => !cat || a.cat === cat)) {
    const states = Object.keys(a.states), anims = D.anims.filter(x => x.id === a.id);
    const card = document.createElement("div"); card.className = "card";
    const w = a.w * zoom, h = a.h * zoom;
    card.innerHTML = `<div class="stage"><img width="${w}" height="${h}" alt="${a.name}"></div>
      <div class="meta">${a.id} ${a.name}<br>${a.w}×${a.h} (1x) · ${a.use}</div><div class="states"></div>`;
    const img = card.querySelector("img"), sb = card.querySelector(".states");
    let cur = { kind: "state", key: states[0] };
    const show = () => {
      if (cur.kind === "state") img.src = P(a.states[cur.key][res]);
      else img.src = frameSrc(cur.anim, res);
      sb.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.k === cur.key));
    };
    for (const s of states) addBtn(s, () => cur = { kind: "state", key: s });
    for (const an of anims) addBtn("▶ " + an.anim, () => cur = { kind: "anim", key: "▶ " + an.anim, anim: an });
    function addBtn(label, fn) {
      if (states.length + anims.length < 2) return;
      const b = document.createElement("button"); b.textContent = label; b.dataset.k = label;
      b.onclick = () => { fn(); show(); }; sb.appendChild(b);
    }
    card._tick = () => { if (cur.kind === "anim") show(); };
    show(); g.appendChild(card);
  }
}
function scene() {
  const S = D.scene, box = $("#scenes");
  if (!S) { box.innerHTML = "<p>No scene defined for this pack.</p>"; return; }
  const z = Math.min(1.5, Math.max(0.4, (innerWidth - 40) / S.w));
  const hint = S.hint || "Click the breaker (dashed outline) to switch the power. Wall and floor are CSS backdrops " +
    "for this demo (not part of the pack).";
  box.innerHTML = `<p class="hint">${hint} Scene zoom ${z.toFixed(2)}×, using 2x files.</p>
    <div id="scene" style="width:${S.w * z}px;height:${S.h * z}px"><div class="wall ${S.backdrop || ""}"></div>
    <div class="floor ${S.backdrop || ""}" style="top:${S.floor * z}px"></div></div>`;
  const root = $("#scene");
  const addTile = t => {                 // repeated image; "anim" tiles play a loop, "y1" also repeats down
    const a = assetOf(t.id), d = document.createElement("div"); d.className = "tile";
    Object.assign(d.style, { left: t.x0 * z + "px", top: t.y * z + "px", width: (t.x1 - t.x0) * z + "px",
      height: ((t.y1 || t.y + a.h) - t.y) * z + "px", backgroundSize: `${a.w * z}px ${a.h * z}px`,
      backgroundRepeat: t.y1 ? "repeat" : "repeat-x", zIndex: t.top ? 5 : "", pointerEvents: "none" });
    t._div = d; t._a = a; root.appendChild(d);
  };
  for (const t of S.tiles.filter(t => !t.top)) addTile(t);
  for (const it of S.items) {
    const a = assetOf(it.id), img = document.createElement("img");
    Object.assign(img.style, { left: it.x * z + "px", top: it.y * z + "px", width: a.w * z + "px", height: a.h * z + "px" });
    img.alt = a.name;
    if (it.switch) { img.className = "switch"; img.onclick = () => { mode = (mode + 1) % modes().length; draw(); }; }
    it._img = img; it._a = a; root.appendChild(img);
  }
  for (const t of S.tiles.filter(t => t.top)) addTile(t);   // overlays such as falling snow
  draw();
}
function draw() {
  if (!D.scene) return;
  const m = modes()[mode];
  for (const t of D.scene.tiles) {
    if (!t._div) continue;
    const st = t[m] !== undefined ? t[m] : (t.always || "default");
    t._div.style.display = st === null ? "none" : "";
    if (st === null) continue;
    const src = st.startsWith("anim:") ? frameSrc(animOf(t.id, st.slice(5)), "2x") : P(t._a.states[st]["2x"]);
    t._div.style.backgroundImage = `url(${src})`;
  }
  for (const it of D.scene.items) {
    let st = m in it ? it[m] : (it.always || Object.keys(it._a.states)[0]);
    if (st === null) { it._img.style.display = "none"; continue; }
    if (Array.isArray(st)) st = st[Math.floor((performance.now() - t0) / 500) % st.length];   // e.g. blinking lights
    it._img.style.display = "";
    if (st.startsWith("anim:")) it._img.src = frameSrc(animOf(it.id, st.slice(5)), "2x");
    else it._img.src = P(it._a.states[st]["2x"]);
  }
}
function pick(sel, attr, fn) {
  document.querySelectorAll(sel).forEach(b => b.onclick = () => {
    document.querySelectorAll(sel).forEach(x => x.classList.remove("on")); b.classList.add("on");
    fn(b.dataset[attr]); gallery(); updateScale();
  });
}
pick("[data-bg]", "bg", v => bg = v); pick("[data-res]", "res", v => res = v);
$("#cat").onchange = e => { cat = e.target.value; gallery(); };
$("#zoom").onchange = e => { zoom = +e.target.value; gallery(); updateScale(); };
$("#tabG").onclick = () => tab(true); $("#tabS").onclick = () => tab(false);
function tab(g) {
  $("#gallery").hidden = !g; $("#gbar").hidden = !g; $("#scenes").hidden = g;
  $("#tabG").classList.toggle("on", g); $("#tabS").classList.toggle("on", !g);
  if (!g) scene();
}
setInterval(() => { tick++; document.querySelectorAll(".card").forEach(c => c._tick && c._tick());
  if (!$("#scenes").hidden) draw(); }, 1000 / 24);
gallery(); updateScale();
</script>
</body>
</html>
